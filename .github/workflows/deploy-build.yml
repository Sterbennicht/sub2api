name: deploy-build

# Private deploy build for this fork. deploy/main = the latest upstream release
# plus our fixes that upstream has not merged yet:
#   - Wei-Shaw/sub2api#7668  http_bridge answers Codex prewarm locally
#   - fix/ws-http-bridge-replay-output  http_bridge replays assistant output
# To move to a new upstream release: rebase deploy/main onto the release's
# "sync VERSION" commit, drop the fixes that were merged upstream, force-push.

on:
  push:
    branches: [deploy/main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Build linux/amd64
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags=embed \
            -ldflags "-s -w -X main.Commit=$(git rev-parse --short HEAD)-deploy -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=release" \
            -o ../sub2api ./cmd/server
      - name: Package
        run: |
          tar czf sub2api_linux_amd64.tar.gz sub2api
          sha256sum sub2api sub2api_linux_amd64.tar.gz | tee SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          TAG="deploy-${VERSION}-$(git rev-parse --short HEAD)"
          gh release create "$TAG" sub2api_linux_amd64.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" --notes "Upstream v${VERSION} plus the fixes listed in .github/workflows/deploy-build.yml. Private deploy build."
